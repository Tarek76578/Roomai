name: RoomAI Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RoomAI
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7'

      - name: Verify project
        run: |
          test -f app/build.gradle
          test -f settings.gradle
          test -f app/src/main/java/com/roomai/app/MainActivity.kt
          echo "RoomAI project verified"

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
