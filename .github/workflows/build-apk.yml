name: RoomAI Build APK

on:
  push:
    branches:
      - main
      - fix/auth-guest-quota-ux-clean
      - agent/roomai-ux-unified
      - agent/roomai-master-pass-20260818
      - agent/roomai-sourcecode-productization-20260821
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RoomAI
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project
        run: |
          test -f app/build.gradle
          test -f settings.gradle
          test -f app/src/main/java/com/roomai/app/MainActivity.kt
          test -f backend.py
          python3 -m py_compile backend.py
          echo "RoomAI Android + backend verified"


      - name: Deep RoomAI audit
        run: |
          python3 tools/roomai_audit.py
          python3 -m py_compile backend.py diagnostic_engine.py

      - name: Productization backend configuration audit
        run: |
          if grep -RInE 'https://[^"[:space:]]+/(generate|diagnose|verify)' \
            app/src/main/java backend.py roomai.py diagnostic_engine.py \
            --exclude='*.backup*' --exclude='*.bak'; then
            echo "ERROR: hardcoded backend endpoint detected."
            exit 1
          fi
          echo "No hardcoded backend endpoint found."

      - name: Kotlin unit tests
        run: |
          gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build Debug APK
        run: |
          gradle assembleDebug \
            -PROOMAI_BACKEND_BASE_URL=https://example.com \
            --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
