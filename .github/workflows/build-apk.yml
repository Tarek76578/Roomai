name: RoomAI Build APK

on:
  push:
    branches:
      - main
      - fix/auth-guest-quota-ux-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RoomAI
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Verify project
        run: |
          test -f app/build.gradle
          test -f settings.gradle
          test -f app/src/main/java/com/roomai/app/MainActivity.kt
          test -f backend.py
          python3 -m py_compile backend.py
          echo "RoomAI Android + backend verified"


      - name: Deep RoomAI audit
        run: |
          python3 tools/roomai_audit.py
          python3 -m py_compile backend.py diagnostic_engine.py

      - name: Kotlin unit tests
        run: |
          gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
