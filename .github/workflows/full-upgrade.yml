name: RoomAI Full Upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Verify RoomAI
        run: |
          set -e
          test -f app/src/main/java/com/roomai/app/MainActivity.kt
          test -f backend.py
          test -f app/build.gradle
          python3 -m py_compile backend.py
          echo "RoomAI source verification OK"

      - name: Build APK
        run: |
          set -e
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Success
        run: |
          echo "========================================"
          echo "ROOMAI BUILD SUCCESS"
          echo "========================================"
