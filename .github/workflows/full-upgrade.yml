name: RoomAI Full Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify project
        run: |
          test -f app/src/main/java/com/roomai/app/MainActivity.kt
          test -f backend.py
          test -f app/build.gradle
          echo "RoomAI project verified"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomAI-full-upgrade-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build summary
        run: |
          echo "======================================"
          echo "RoomAI build completed successfully"
          echo "======================================"
