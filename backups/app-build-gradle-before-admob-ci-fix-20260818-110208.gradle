plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.roomai.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.roomai.app'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '2.0'

        manifestPlaceholders = [
            roomAiAdmobAppId:
                project.findProperty("ROOMAI_ADMOB_APP_ID")
                    ?: "ca-app-pub-3940256099942544~3347511713"
        ]
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField(
                "String",
                "ROOMAI_INTERSTITIAL_AD_ID",
                "\"${project.findProperty("ROOMAI_INTERSTITIAL_AD_ID") ?: "ca-app-pub-3940256099942544/1033173712"}\""
            )
        }

        release {
            if (!project.hasProperty("ROOMAI_ADMOB_APP_ID") ||
                !project.hasProperty("ROOMAI_INTERSTITIAL_AD_ID")) {
                throw new GradleException(
                    "RoomAI release requires real AdMob IDs."
                )
            }

            buildConfigField(
                "String",
                "ROOMAI_INTERSTITIAL_AD_ID",
                "\"${project.findProperty("ROOMAI_INTERSTITIAL_AD_ID")}\""
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation platform('androidx.compose:compose-bom:2026.06.01')

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}
