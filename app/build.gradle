plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.roomai.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.roomai.app'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '2.0'

        manifestPlaceholders = [
            roomAiAdmobAppId:
                project.findProperty("ROOMAI_ADMOB_APP_ID")
                    ?: "ca-app-pub-3940256099942544~3347511713"
        ]
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildConfigField(
        "String",
        "ROOMAI_BACKEND_BASE_URL",
        "\"${project.findProperty("ROOMAI_BACKEND_BASE_URL") ?: "https://example.com"}\""
    )

    buildTypes {
        debug {
            buildConfigField(
                "String",
                "ROOMAI_INTERSTITIAL_AD_ID",
                "\"${project.findProperty("ROOMAI_INTERSTITIAL_AD_ID") ?: "ca-app-pub-3940256099942544/1033173712"}\""
            )
        }

        release {
            def releaseAdMobAppId =
                project.findProperty("ROOMAI_ADMOB_APP_ID")
            def releaseInterstitialAdId =
                project.findProperty("ROOMAI_INTERSTITIAL_AD_ID")

            buildConfigField(
                "String",
                "ROOMAI_INTERSTITIAL_AD_ID",
                "\"${releaseInterstitialAdId ?: ""}\""
            )

            manifestPlaceholders.roomAiAdmobAppId =
                releaseAdMobAppId ?: ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}


// RoomAI production AdMob release protection.
//
// Debug builds are allowed to use Google's official test IDs.
// Release packaging requires real AdMob IDs supplied through
// Gradle project properties:
//
//   -PROOMAI_ADMOB_APP_ID=ca-app-pub-...
//   -PROOMAI_INTERSTITIAL_AD_ID=ca-app-pub-...
//
// Never silently ship a release build with Google's test IDs.

afterEvaluate {
    tasks.configureEach { task ->
        def taskName = task.name.toLowerCase()

        if (taskName.contains("release") &&
            (taskName.contains("assemble") ||
             taskName.contains("bundle") ||
             taskName.contains("package"))) {

            task.doFirst {
                def appId = project.findProperty("ROOMAI_ADMOB_APP_ID")
                def interstitialId =
                    project.findProperty("ROOMAI_INTERSTITIAL_AD_ID")

                def backendBaseUrl =
                    project.findProperty("ROOMAI_BACKEND_BASE_URL")

                def googleTestAppId =
                    'ca-app-pub-3940256099942544~3347511713'

                def googleTestInterstitialId =
                    'ca-app-pub-3940256099942544/1033173712'

                if (!appId ||
                    !interstitialId ||
                    !backendBaseUrl ||
                    backendBaseUrl.toString().trim().isEmpty() ||
                    appId == googleTestAppId ||
                    interstitialId == googleTestInterstitialId) {

                    throw new GradleException(
                        'RoomAI production release requires real AdMob IDs ' +
                        'and ROOMAI_BACKEND_BASE_URL. ' +
                        'Set ROOMAI_ADMOB_APP_ID, ' +
                        'ROOMAI_INTERSTITIAL_AD_ID and ' +
                        'ROOMAI_BACKEND_BASE_URL.'
                    )
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation platform('androidx.compose:compose-bom:2026.06.01')

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}
